<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408 宋纪雨溪 第八周JavaScript</title>
</head>
<body>
    <script>
        //1.变量的声明和使用
        var name = "宋纪雨溪";//声明一个变量name，赋值为"宋纪雨溪"
        var id = "24001010408";//声明一个变量id，保存学号
        console.log("姓名：" + name);//输出name的值
        document.write("<h1>JavaScript基础</h1>");//输出一级标题
        document.write("hello," + "<br>");//输出hello
        document.write("姓名：" + name + "<br>");//输出name的值
        document.write("学号：" + id + "<br>");//输出学号
        alert("欢迎来到JavaScript的基础学习！");//弹出一个提示框
        var res = confirm("你是否喜欢学习JavaScript吗？");//弹出一个确认框
        if(res){
            document.write("我选择了继续学习JavaScript！<br>");
            console.log("用户选择的是确认值：" + res);
        }
        else{
            document.write("我选择了不继续学习JavaScript！<br>");
            console.log("用户选择的是确认值：" + res);
        }
    </script>
</body>
</html>
