<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408 宋纪雨溪 第八周JavaScript变量</title>
</head>
<body>
    <!--JavaScript变量命名规则
        1.变量名只能包含字母、数字、下划线和美元符号
        2.变量名不能以数字开头
        3.变量名区分大小写
        4.变量名不能使用JavaScript保留字
    -->

    <script>
        var _str = "宋纪雨溪";          // 下划线开头，汉字字符串
        var $num = 2026;               // 美元符号开头，数字
        var age2 = 20;                 // 字母 + 数字结尾，数字
        var sno = "24001010408";       // 学号，用字符串保存（前导 0 不会丢）
        console.log("姓名：" + _str + "，_str类型：" + typeof _str);
        console.log("学号：" + sno + "，sno类型：" + typeof sno);
        console.log("年份：" + $num + "，$num类型：" + typeof $num);
        console.log("年龄：" + age2 + "，age2类型：" + typeof age2);
        // 变量的重新赋值
        _str = "JavaScript";
        console.log("_str:" + _str);
        //1.逻辑运算符的使用
        console.log("逻辑运算符的使用：");
        console.log(true && false, true || false, !false);
        console.log(++$num, $num--, $num);
        //2."+"在字符串和数字之间时，会做字符串拼接（不是转数字再相加）
        //"-"在字符串和数字之间时，会先把字符串转成数字，再进行减法运算
        console.log("1" + 1, "1" - 1);
        //3.NaN(Not a Number)表示不是一个数字，NaN与任何值都不相等，包括它自己
        console.log("NaN的使用；");
        console.log(NaN == NaN, NaN != NaN);
        //4.undefined表示变量已声明但未赋值，null表示变量已声明并赋值为null
        console.log("undefined的使用；");
        console.log(undefined == undefined, undefined != undefined, null == null, null == null);
        var res = Number("abc");
        console.log("res:" + res + "，类型：" + typeof res)   // "abc" 无法转成数字，得到 NaN
        //数字运算中的NaN
        var d = 0 / 0;
        console.log("d:" + d)
        console.log("isNaN(d):" + isNaN(d), isNaN("abc"), isNaN(123));
    </script>
</body>
</html>
