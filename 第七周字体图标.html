<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0408 宋纪雨溪 第七周字体图标</title>
    <link rel="stylesheet" href="./fonts/iconfont.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .iconfont {
            font-size: 48px;
            margin-right: 40px;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
        }


        .iconfont:last-child {
            margin-right: 0;
        }

        .iconfont:hover {
            color: #b23535;
            transform: scale(1.2);
        }
        .icon-daxiang {
            color: #4fc1e0;
        }

        .icon-jingyu {
            font-size: 440px;
            color: #d78ea5;
        }

        .icon-putao {
            color: #a587cf;
        }

        .icon-taiyang {
            color: #faad14;
        }

    </style>

</head>
<body>
    <span class="iconfont icon-daxiang"></span>
    <span class="iconfont icon-jingyu"></span>
    <span class="iconfont icon-putao"></span>
    <span class="iconfont icon-taiyang"></span>
</body>
</html>
