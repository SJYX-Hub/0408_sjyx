<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20261102 宋纪雨溪 DOM</title>
    <style>
        .list{
            /* 关键：让 li 横向排列，一行放不下自动换行，并去掉前面默认的小圆点 */
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list li{
            width: 160px;
            height: 160px;
            line-height: 160px;
            text-align: center;
            background-color: aqua;
            color: red;
            margin: 10px;
            font-size: 60px;
            transition: all .6s;
        }
       
        .clicked{
            background-color: gold;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <!-- DOM: Document Object Model 文档对象模型-->
    <button>改变h2的html和css</button>
    <button>在h2中显示li的nodename和nodeType</button>
    <button>点击后，点击任意li都可以切换类，包括相邻节点</button>
    <button>点击后，双击任意li可以将其删除</button>
    <button>克隆</button>
    <button>点击后，onmousemove时，li内显示你的名字</button>
    <button>点击后，onmousemove时，li内显示你的学号后四位</button>

    <div id="box">
        <h2>宋纪雨溪 DOM</h2>
        <ul class="list">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li>7</li>
            <li>8</li>
            <li>9</li>
            <li>10</li>
        </ul>
    </div>

<script>
    // 获取dom元素
    // var box = document.getElementById("box");
    var box = document.querySelector("#box");
    // 获取所有的按钮 得到的是array-like对象 类数组
    var btns = document.getElementsByTagName("button");

    // var h2 = box.getElementsByTagName("h2")[0];
    var h2 = box.querySelector("h2");
    var ul = box.querySelector("ul");
    var li = box.querySelectorAll("li");

    console.log(btns,box,h2,li);

    // ========== 按钮1：改变h2的html和css ==========
    btns[0].onclick = ()=>{
        h2.innerHTML = "songjiyuxi javaScript";
        // textContent 只能改变文本内容，不能改变html标签
        h2.style.cssText = "color: red; font-size: 36px;";
        h2.style.backgroundColor = "pink";
        h2.style.setProperty("font-weight","bold");
    }

    // ========== 按钮2：课件原版，输出nodeName nodeType ==========
    btns[1].onclick = ()=>{
        h2.innerHTML = "li的nodename是:" + li[0].nodeName + "<br>li的nodeType是:" + li[0].nodeType;
    }
    // nodeType的值：1表示元素节点，2表示属性节点，3表示文本节点

    // ========== 按钮3：课件原版 for循环 + classList.toggle('clicked') ==========
    btns[2].onclick = ()=>{
        for(var i = 0 ; i < li.length ; i++){
            li[i].onclick = function(){
                // this指向当前点击的li元素
                this.classList.toggle('clicked');
            }
        }
    }

    // ========== 按钮4：开启双击删除li ==========
    var flag4 = false;
    btns[3].onclick = function(){
        if(flag4) return;
        flag4 = true;
        var liList = ul.querySelectorAll("li");
        for(let i=0;i<liList.length;i++){
            liList[i].ondblclick = function(){
                this.remove();
            }
        }
    }

    // ========== 按钮5：课件原版，createElement 新建 li 追加到 ul ==========
    btns[4].onclick = ()=>{
        var nli = document.createElement("li");
        // 加在哪里
        ul.appendChild(nli);
        // nli.innerHTML = ul.children.length;
        // nli.innerHTML = ul.childElementCount;
        nli.innerHTML = ul.querySelectorAll("li").length;
    }

    // ========== 按钮6：课件原版，onmousemove 时 li 内显示名字 ==========
    btns[5].onclick = ()=>{
        for(var i = 0; i < li.length; i++){
            li[i].onmousemove = function(){
                // this.innerText = "陈莹羽";
                this.textContent = "宋纪雨溪";
                this.style.fontSize = "20px";
            }
        }
    }

    // ========== 按钮7：自己实现 —— onmousemove 时 li 内显示学号后四位 ==========
    var xuehao = "0408"; // 宋纪雨溪 学号 24001010408 的后四位
    btns[6].onclick = ()=>{
        for(var i = 0; i < li.length; i++){
            li[i].onmousemove = function(){
                this.textContent = xuehao;
                this.style.fontSize = "20px";
            }
        }
    }
</script>
</body>
</html>
