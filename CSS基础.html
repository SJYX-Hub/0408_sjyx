<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001010408 宋纪雨溪 CSS基础：3分钟引入方式以及CSS选择器</title>
    <style>
        h1{
            background-color: rgb(219, 101, 178);
        }
        h2{
            background-color: blue;
        }
        /* 2. ID选择器 :#id名  id名不能重复*/
        #section{
            background-color: yellow;
            height: 100px;
            width: 1200px;
        }
        /* 3. 类选择器 :.类名  类名可以重复*/
        .list{
            background-color: pink;
        }
        /* 4. 后代选择器 :父元素>子元素  子元素必须是直接元素*/
        p{
            font-size: 20px;
        }
        .list p{
            font-size: 30px;
            font-weight: bold;
        }
        #section li{
            color: red;
        }

    </style>
    <!--3.第三种：外嵌样式-->
    <link rel="stylesheet" href="./css/common.css">
</head>
<body>
    

    <h1>CSS的3种引入方式演示</h1>
    <h2 style="color: rgba(223, 48, 48, 0.742);">第一张方式:内嵌样式/行内样式</h2>
    <p  style="background-color: blueviolet;width: 1000px;">我是行内样式，一般不推荐</p>
    <p  style="background-color: green;width: 500px;color:azure">我是P标签</p>
  
    <h2 style="color: rgb(86, 193, 207)">第二种方式：内嵌样式</h2>
    <div id="section">
        <ul class="list">
            <li>列表项1</li>
            <li>列表项2</li>
            <li>列表项3</li>
        </ul>
        <div class="list">
            <p>我是段落</p>
            <p>我是Class名,为list的div标签内的P标签</p>
            <p>我是类名为list的div标签内的P标签</p>
        </div>
    </div>

</body>
</html>
