<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001010408 宋纪雨溪 box model=盒模型=框模型</title>
    <style>
        body{
            background-color: antiquewhite;
            color: black;
        }
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            /*盒模型属性：宽度*/
            width: 1200px;
            /*外边距：上下 左右*/
            margin: 0 auto;
            background-color: rgb(181, 162, 212);
        }
        h2{
            /*文本居中*/
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }
        .card-warp{
            background-color: pink;
        }
        #card-warp{
            background-color: rgb(90, 203, 150);
        }
        .card{
            width: 384px;
            background-color: white;
            /*padding 内边距:上下左右 */
            /* padding: 20px; */
            /* 内边距，两个值：上下 左右 */
            /* padding: 20px  50px; */
            /* 三个值： 上边距 左右 下边距 */
            /* padding: 20px 40px 60px; */
            /* 四个值：顺时针记忆 上 右 下 左 */
            padding: 20px 40px 60px 80px;
            /* margin外边距 */
            /* margin: 20px; */
            margin: 30px auto;
            /* 边框: 三个属性 边框的大小 边框样式: 实线，虚线，点虚线 边框颜色 */
            border: 1px solid #333;
        }
        .card-img{
            width: 100%;
            height: 220px;
            /* 图片现在使用真实图片，不再用背景色 */
            border:dotted 2px #329db0;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-img img{
            width: 100%;
            height: 100%;
        }
        .card-title{
            font-size: 24px;
            margin-bottom: 20px;
        }
        .card-desc{
            font-size: 20px;
            color: #666;
            font-weight: 400;
        }
        .price{
            margin-top: 10px;
            font-weight: bold;
        }
        /*标签选择器一般都是以后代选择器或者群组选择器*/
    </style>
</head>
<body>
    <div class="container">
    <h2>安踏精选商品卡片</h2>
    <div id="card-wrap" class="card-wrap">
        <div class="card"> 
            <!-- 普通卡片 -->
            <div class="card-img">
                <img src="images/tshirt.jpg" alt="安踏短袖T恤">
            </div>
            <h3 class="card-title">安踏基础款短袖T恤</h3>
            <p class="card-desc">透气纯棉面料，舒适亲肤，简约百搭</p>
            <div class="price">￥99</div>
        </div>

        <div class="card"> 
            <div class="card-img">
                <img src="images/shoes.jpg" alt="安踏跑步鞋">
            </div>
            <h3 class="card-title">安踏减震跑步鞋</h3>
            <p class="card-desc">全新缓震科技，轻弹鞋底，为奔跑提供支撑</p>
            <div class="price">￥399</div>
        </div>

        <div class="card"> 
            <div class="card-img">
                <img src="images/pants.jpg" alt="安踏运动长裤">
            </div>
            <h3 class="card-title">安踏休闲运动长裤</h3>
            <p class="card-desc">四面弹力面料，修身版型，适合运动休闲</p>
            <div class="price">￥199</div>
        </div>
    </div>
</body>
</html>
