<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0408 宋纪雨溪 基于svg的自适应宽度固定下导航</title>
    <script src="./fonts/iconfont.js"></script>
    <style>
        .icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        fill: currentColor;
        overflow: hidden;
        }
        ul,p{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
        }
        a{
            text-decoration: none;
            color: #000;
        }
        #bnav{
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        #bnav li{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <ul>
        <li>    
            <a href="#">
                <!-- 第三步 -->
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-diejimu"></use>
                </svg>
                <p>积木</p>
            </a>
        </li>
        <li>    
            <a href="#">
                <!-- 第三步 -->
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-taiyang"></use>
                </svg>
                <p>太阳</p>
            </a>
        </li>
        <li>    
            <a href="#">
                <!-- 第三步 -->
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-caidan"></use>
                </svg>
                <p>彩蛋</p>
            </a>
        </li>
        <li>    
            <a href="#">
                <!-- 第三步 -->
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-dengta"></use>
                </svg>
                <p>灯塔</p>
            </a>
        </li>
    </ul>
</body>
</html>
