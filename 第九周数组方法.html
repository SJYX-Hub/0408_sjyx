<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-10-26 宋纪雨溪 数组 数组方法</title>
</head>
<body>
<script>
// 数组定义
var arr = [1, 2, 3, 4, 5];
console.log(arr);

var arr1 = ["song", "ji", "yu", "xi", true, 1, 2];
console.log(arr1);

var arr2 = new Array(4);
console.log(arr2);

var arr3 = new Array(3, 7, 8, "sjyx", 'hello');
console.log(arr3, arr3.length);

arr["song"] = "jiyuxi";

// 不计算在数组长度之内，将数组arr当作对象来使用
console.log(arr, arr.length, arr.song);

// 数组的循环
for (var i = 0; i < arr1.length; i++) {
    console.log(i + ":" + arr1[i]);
}

// 数组的循环 for in
for (let key in arr1) {
    console.log(key, arr1[key]);
}

for(let v of arr1){
    console.log(v)
}

// 数组方法
// 1.循环
arr1.forEach(function(v,i){
    console.log("数组循环，索引："+i+";值："+v)
})
// 2.增加，删除元素
var narr = arr1.push("dog")
console.log(narr,arr1)
arr1.pop()
console.log(arr1)

arr1.unshift('rat')
console.log("unshift:"+arr1)
arr1.shift()
console.log("shift:"+arr1)

// 2.3 在指定位置 增加或者删除元素
arr1.splice(5)
console.log("splice:"+arr1)
narr=arr1.splice(2,1)
console.log("splice(2,1):"+arr1+";narr:"+narr)
narr=arr1.splice(1,0,"gold","silver","red")
console.log('arr1.splice(1,0,"gold","silver","red"):'+arr1+"###narr:"+narr)
// 3、获取数组片段
narr = arr1.slice(1,3)
console.log('slice(1,3):'+arr1+"###narr:"+narr)

// 6、数组拼接:把数组成员通过连接符连接成一个字符串
console.log(arr1.join('***'))

arr = [45,66,78,88,90,98,75,36]
// 7、数组排序
narr=arr.sort(function(a,b){
    // a-b表示正序，b-a表示倒序
    return a-b;
})
console.log("数组方法 sort:",narr,arr)
// 8、过滤
narr = arr.filter((v,i)=>{
    return v>=75
})
console.log("数组方法 filter:",narr,arr)
</script>
</body>
</html>
